<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maaf Yaa Cantik</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 50%, #fecfef 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Arial', sans-serif;
        }

        .cat-container {
            text-align: center;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
        }

        .cat {
            position: relative;
            width: 300px;
            height: 350px;
            margin: 0 auto;
        }

        .body {
            width: 200px;
            height: 180px;
            background: #f4c2c2;
            border-radius: 50% 50% 40% 40%;
            position: absolute;
            left: 50px;
            top: 120px;
            z-index: 2;
            border: 8px solid #e8a8a8;
        }

        .head {
            width: 160px;
            height: 160px;
            background: #f4c2c2;
            border-radius: 50%;
            position: absolute;
            left: 70px;
            top: 20px;
            z-index: 3;
            border: 8px solid #e8a8a8;
        }

        .ears {
            position: absolute;
            width: 0;
            height: 0;
            border-left: 25px solid transparent;
            border-right: 25px solid transparent;
            border-bottom: 45px solid #f4c2c2;
            z-index: 4;
        }

        .ear-left {
            left: 30px;
            top: -10px;
            transform: rotate(-20deg);
        }

        .ear-right {
            right: 30px;
            top: -10px;
            transform: rotate(20deg);
        }

        .ear-inner {
            position: absolute;
            width: 0;
            height: 0;
            border-left: 15px solid transparent;
            border-right: 15px solid transparent;
            border-bottom: 30px solid #ff8fab;
            top: 8px;
        }

        .ear-inner-left {
            left: -15px;
        }

        .ear-inner-right {
            right: -15px;
        }

        .eyes {
            position: absolute;
            top: 60px;
            width: 25px;
            height: 25px;
            background: #fff;
            border-radius: 50%;
            border: 4px solid #000;
        }

        .eye-left {
            left: 45px;
        }

        .eye-right {
            right: 45px;
        }

        .pupil {
            position: absolute;
            top: 5px;
            left: 5px;
            width: 12px;
            height: 12px;
            background: #333;
            border-radius: 50%;
            animation: blink 4s infinite;
        }

        .pupil-sad {
            top: 8px;
            left: 6px;
            width: 10px;
            height: 10px;
            background: #555;
            border-radius: 50% 50% 60% 40%;
            transform: rotate(-10deg);
        }

        @keyframes blink {
            0%, 90%, 100% { height: 12px; }
            95% { height: 2px; }
        }

        .nose {
            position: absolute;
            top: 90px;
            left: 75px;
            width: 12px;
            height: 10px;
            background: #ff69b4;
            border-radius: 50%;
        }

        .mouth {
            position: absolute;
            top: 105px;
            left: 65px;
            width: 30px;
            height: 25px;
            border: 4px solid transparent;
            border-bottom-color: #333;
            border-radius: 0 0 50px 50px;
            transform: rotate(-10deg);
        }

        .mouth::before {
            content: '';
            position: absolute;
            top: -2px;
            left: 8px;
            width: 4px;
            height: 4px;
            background: #333;
            border-radius: 50%;
        }

        .whiskers {
            position: absolute;
            top: 95px;
            height: 2px;
            background: #333;
        }

        .whisker-left-1 { left: 20px; width: 25px; transform: rotate(-10deg); }
        .whisker-left-2 { left: 20px; top: 100px; width: 30px; transform: rotate(-5deg); }
        .whisker-left-3 { left: 20px; top: 90px; width: 20px; transform: rotate(5deg); }

        .whisker-right-1 { right: 20px; width: 25px; transform: rotate(10deg); }
        .whisker-right-2 { right: 20px; top: 100px; width: 30px; transform: rotate(5deg); }
        .whisker-right-3 { right: 20px; top: 90px; width: 20px; transform: rotate(-5deg); }

        .paws {
            position: absolute;
            width: 35px;
            height: 35px;
            background: #f4c2c2;
            border-radius: 50%;
            border: 6px solid #e8a8a8;
        }

        .paw-left-upper {
            left: 10px;
            top: 220px;
            z-index: 1;
        }

        .paw-right-upper {
            right: 10px;
            top: 220px;
            z-index: 1;
        }

        .paw-left-lower {
            left: 20px;
            top: 280px;
            z-index: 1;
        }

        .paw-right-lower {
            right: 20px;
            top: 280px;
            z-index: 1;
        }

        .sorry-sign {
            position: absolute;
            left: 80px;
            top: 200px;
            width: 140px;
            height: 80px;
            background: linear-gradient(145deg, #fff, #f0f0f0);
            border-radius: 15px;
            border: 6px solid #ff6b9d;
            box-shadow: 8px 8px 16px #d9d9d9, -8px -8px 16px #ffffff;
            z-index: 5;
            animation: shake 2s infinite;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-3px); }
            75% { transform: translateX(3px); }
        }

        .sorry-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 18px;
            font-weight: bold;
            color: #ff4785;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
            font-family: 'Comic Sans MS', cursive;
            z-index: 6;
        }

        .tail {
            position: absolute;
            right: -20px;
            top: 150px;
            width: 80px;
            height: 20px;
            background: #f4c2c2;
            border-radius: 40px 10px 10px 40px;
            border: 6px solid #e8a8a8;
            transform: rotate(-30deg);
            z-index: 1;
        }

        .tail::after {
            content: '';
            position: absolute;
            right: -10px;
            top: 5px;
            width: 25px;
            height: 15px;
            background: #ff8fab;
            border-radius: 50%;
        }

        .heart {
            position: absolute;
            font-size: 30px;
            color: #ff69b4;
            animation: heartbeat 1.5s infinite;
            top: 10px;
            right: 20px;
        }

        @keyframes heartbeat {
            0% { transform: scale(1); }
            14% { transform: scale(1.3); }
            28% { transform: scale(1); }
            42% { transform: scale(1.3); }
            70% { transform: scale(1); }
        }
    </style>
</head>
<body>
    <div class="cat-container">
        <div class="heart">💕</div>
        <div class="cat">
            <!-- Ears -->
            <div class="ears ear-left">
                <div class="ear-inner ear-inner-left"></div>
            </div>
            <div class="ears ear-right">
                <div class="ear-inner ear-inner-right"></div>
            </div>
            
            <!-- Head -->
            <div class="head">
                <!-- Eyes -->
                <div class="eyes eye-left">
                    <div class="pupil pupil-sad"></div>
                </div>
                <div class="eyes eye-right">
                    <div class="pupil pupil-sad"></div>
                </div>
                
                <!-- Nose -->
                <div class="nose"></div>
                
                <!-- Mouth -->
                <div class="mouth"></div>
                
                <!-- Whiskers -->
                <div class="whiskers whisker-left-1"></div>
                <div class="whiskers whisker-left-2"></div>
                <div class="whiskers whisker-left-3"></div>
                <div class="whiskers whisker-right-1"></div>
                <div class="whiskers whisker-right-2"></div>
                <div class="whiskers whisker-right-3"></div>
            </div>
            
            <!-- Body -->
            <div class="body"></div>
            
            <!-- Tail -->
            <div class="tail"></div>
            
            <!-- Paws -->
            <div class="paws paw-left-upper"></div>
            <div class="paws paw-right-upper"></div>
            <div class="paws paw-left-lower"></div>
            <div class="paws paw-right-lower"></div>
        
            <!-- Sorry Sign -->
            <div class="sorry-sign">
                <div class="sorry-text">Maaf yaaaa! 😔🙏</div>
            </div>
        </div>
        <p style="color: #ff69b4; font-size: 20px; margin-top: 20px; font-weight: bold;">
           Jangan Ngambek lagiii yaaaa! Aku sayang kamu banget! 💖
        </p>
    </div>
</body>
</html>
